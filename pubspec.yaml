name: financesistent
description: A personal finance manager desktop application inspired by Firefly III
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  
  # Database
  drift: ^2.14.1
  sqlcipher_flutter_libs: ^0.6.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.1
  fl_chart: ^1.1.1
  intl: ^0.20.2
  
  # Utilities
  uuid: ^4.2.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0
  csv: ^6.0.0
  file_picker: ^8.1.6
  
  # Icons
  font_awesome_flutter: ^10.6.0
  window_manager: ^0.5.1
  http: ^1.6.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^4.0.3
  drift_dev: ^2.14.1
  freezed: ^3.2.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
